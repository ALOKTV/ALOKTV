<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260">
  <defs>
    <linearGradient id="bgB" x1="0" x2="1"><stop offset="0%" stop-color="#04121a"/><stop offset="100%" stop-color="#06212b"/></linearGradient>
    <linearGradient id="rim" x1="0" x2="1"><stop offset="0%" stop-color="#77d2ff"/><stop offset="100%" stop-color="#1fb6ff"/></linearGradient>
    <filter id="bigShadow"><feDropShadow dx="0" dy="18" stdDeviation="28" flood-color="#001420" flood-opacity="0.6"/></filter>
    <filter id="avatarShadow"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#001827" flood-opacity="0.6"/></filter>
  </defs>

  <rect width="100%" height="100%" fill="url(#bgB)"/>

  <g transform="translate(36,18)">
    <rect x="0" y="0" width="1128" height="176" rx="22" fill="#071627" filter="url(#bigShadow)"/>
    <rect x="6" y="6" width="1116" height="164" rx="16" fill="rgba(255,255,255,0.02)"/>

    <!-- avatar with metallic rim (uses GitHub avatar) -->
    <g transform="translate(40,26)">
      <circle cx="80" cy="80" r="70" fill="#062736" filter="url(#avatarShadow)"/>
      <circle cx="80" cy="80" r="66" fill="url(#rim)"/>
      <defs>
        <clipPath id="avClip"><circle cx="80" cy="80" r="60"/></clipPath>
      </defs>
      <image xlink:href="https://github.com/ALOKTV.png" x="20" y="20" width="120" height="120" preserveAspectRatio="xMidYMid slice" clip-path="url(#avClip)" />
      <circle cx="80" cy="80" r="60" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
    </g>

    <!-- text block -->
    <g transform="translate(220,48)">
      <text x="0" y="22" font-family="Segoe UI, Roboto, Arial" font-size="40" font-weight="700" fill="#eaf9ff" style="letter-spacing:0.6px">ALOKTV</text>
      <text x="0" y="54" font-family="Segoe UI, Roboto, Arial" font-size="16" fill="#9db6c6">Full-Stack Software Engineer</text>
      <text x="0" y="80" font-family="Segoe UI, Roboto, Arial" font-size="13" fill="#88a2b2">Shimoga, India  •  +91 6362117360  •  <a href='mailto:aloktvalok@gmail.com'>aloktvalok@gmail.com</a></text>

      <!-- sleek glass buttons -->
      <g transform="translate(0,102)">
        <a xlink:href="https://github.com/ALOKTV" target="_blank">
          <rect x="0" y="0" width="150" height="42" rx="10" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.02)"/>
          <text x="75" y="28" font-family="Segoe UI, Roboto, Arial" font-size="14" fill="#e8f7ff" text-anchor="middle">View Profile</text>
        </a>
        <a xlink:href="./RESUME.md" target="_blank">
          <rect x="170" y="0" width="150" height="42" rx="10" fill="rgba(31,98,140,0.16)" stroke="rgba(255,255,255,0.02)"/>
          <text x="245" y="28" font-family="Segoe UI, Roboto, Arial" font-size="14" fill="#b9dff9" text-anchor="middle">Download CV</text>
        </a>
      </g>
    </g>

    <!-- decorative glossy stroke -->
    <rect x="1100" y="18" width="18" height="140" rx="9" fill="rgba(255,255,255,0.02)"/>
  </g>
</svg>
