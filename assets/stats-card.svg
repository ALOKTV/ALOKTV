<svg xmlns="http://www.w3.org/2000/svg" width="840" height="240" viewBox="0 0 840 240">
  <defs>
    <linearGradient id="g" x1="0" x2="1"><stop offset="0%" stop-color="#071827"/><stop offset="100%" stop-color="#0b2b3a"/></linearGradient>
    <filter id="s" x="-50%" y="-50%" width="200%" height="200%"><feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#000" flood-opacity="0.5"/></filter>
  </defs>
  <rect width="100%" height="100%" rx="12" fill="url(#g)" filter="url(#s)"/>
  <g transform="translate(20,20)">
    <text x="0" y="28" font-family="Segoe UI, Roboto, Arial" font-size="18" fill="#bfe8ff">GitHub Stats</text>
    <rect x="0" y="44" width="1" height="150" fill="transparent"/>

    <g transform="translate(0,56)">
      <g>
        <rect x="0" y="0" width="220" height="120" rx="10" fill="#071f2a" stroke="#143641"/>
        <text x="110" y="36" font-family="Segoe UI, Roboto, Arial" font-size="18" fill="#9fd8ff" text-anchor="middle">384</text>
        <text x="110" y="60" font-family="Segoe UI, Roboto, Arial" font-size="12" fill="#8aa6b6" text-anchor="middle">Commits</text>
      </g>

      <g transform="translate(240,0)">
        <rect x="0" y="0" width="220" height="120" rx="10" fill="#071f2a" stroke="#143641"/>
        <text x="110" y="36" font-family="Segoe UI, Roboto, Arial" font-size="18" fill="#9fd8ff" text-anchor="middle">12</text>
        <text x="110" y="60" font-family="Segoe UI, Roboto, Arial" font-size="12" fill="#8aa6b6" text-anchor="middle">Repositories</text>
      </g>

      <g transform="translate(480,0)">
        <rect x="0" y="0" width="300" height="120" rx="10" fill="#071f2a" stroke="#143641"/>
        <text x="150" y="36" font-family="Segoe UI, Roboto, Arial" font-size="18" fill="#9fd8ff" text-anchor="middle">A+</text>
        <text x="150" y="60" font-family="Segoe UI, Roboto, Arial" font-size="12" fill="#8aa6b6" text-anchor="middle">Score</text>
      </g>
    </g>

    <g transform="translate(0,184)">
      <text x="0" y="16" font-family="Segoe UI, Roboto, Arial" font-size="12" fill="#7f98a4">Most Used Language</text>
      <rect x="0" y="26" width="420" height="10" rx="6" fill="#0d3550"/>
      <rect x="0" y="26" width="190" height="10" rx="6" fill="#1f6feb"/>
      <text x="430" y="36" font-family="Segoe UI, Roboto, Arial" font-size="12" fill="#9fb6c7">TypeScript — 45%</text>
    </g>
  </g>
</svg>
